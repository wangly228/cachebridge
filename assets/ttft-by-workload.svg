<svg xmlns="http://www.w3.org/2000/svg" width="940" height="448" viewBox="0 0 940 448" role="img" aria-labelledby="title desc">
  <title id="title">Engine p95 time to first token with a CPU prefix cache</title>
  <desc id="desc">Compared with the native GPU prefix cache, cachebridge with a 32-block first-use budget reduces evicted-prefix replay p95 by 81.05% and 82.39% for mixed- and long-prefix workloads. Full-trace p95 increases by 5.02% and 5.28%. Whiskers show 95% paired-seed bootstrap intervals.</desc>
  <rect width="940" height="448" rx="10" fill="#fafcfd"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193447">
    <text x="26" y="37" font-size="26" font-weight="bold" fill="#193447" text-anchor="start">Engine p95 time to first token</text>
    <text x="26" y="63" font-size="15" font-weight="normal" fill="#425969" text-anchor="start">Qwen3-4B BF16   ·   RTX 3090   ·   4 concurrent requests   ·   36 GPU blocks   ·   64 CPU slots</text>
    <line x1="26.00" x2="914.00" y1="80" y2="80" stroke="#c8d5da" stroke-width="1"/>
    <text x="26" y="106" font-size="15" font-weight="bold" fill="#193447" text-anchor="start">Request phase</text>
    <text x="234" y="106" font-size="15" font-weight="bold" fill="#193447" text-anchor="end">n</text>
    <text x="282" y="106" font-size="15" font-weight="bold" fill="#193447" text-anchor="start">Change vs. GPU-only</text>
    <text x="705" y="106" font-size="15" font-weight="bold" fill="#193447" text-anchor="end">Change</text>
    <text x="792" y="106" font-size="15" font-weight="bold" fill="#193447" text-anchor="end">GPU-only</text>
    <text x="914" y="106" font-size="15" font-weight="bold" fill="#193447" text-anchor="end">cachebridge</text>
    <text x="234" y="126" font-size="13" font-weight="normal" fill="#465e6c" text-anchor="end">per arm</text>
    <text x="792" y="126" font-size="13" font-weight="normal" fill="#465e6c" text-anchor="end">ms</text>
    <text x="914" y="126" font-size="13" font-weight="normal" fill="#465e6c" text-anchor="end">ms</text>
    <text x="316.7" y="126" font-size="12" font-weight="normal" fill="#465e6c" text-anchor="middle">−80%</text>
    <line x1="316.70" x2="316.70" y1="162" y2="246" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="316.70" x2="316.70" y1="298" y2="382" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="386.1" y="126" font-size="12" font-weight="normal" fill="#465e6c" text-anchor="middle">−60%</text>
    <line x1="386.10" x2="386.10" y1="162" y2="246" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="386.10" x2="386.10" y1="298" y2="382" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="455.5" y="126" font-size="12" font-weight="normal" fill="#465e6c" text-anchor="middle">−40%</text>
    <line x1="455.50" x2="455.50" y1="162" y2="246" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="455.50" x2="455.50" y1="298" y2="382" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="524.9" y="126" font-size="12" font-weight="normal" fill="#465e6c" text-anchor="middle">−20%</text>
    <line x1="524.90" x2="524.90" y1="162" y2="246" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="524.90" x2="524.90" y1="298" y2="382" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="594.3" y="126" font-size="12" font-weight="normal" fill="#465e6c" text-anchor="middle">0%</text>
    <line x1="594.30" x2="594.30" y1="162" y2="246" stroke="#94a9b5" stroke-width="1.4"/>
    <line x1="594.30" x2="594.30" y1="298" y2="382" stroke="#94a9b5" stroke-width="1.4"/>
    <text x="629.0" y="126" font-size="12" font-weight="normal" fill="#465e6c" text-anchor="middle">+10%</text>
    <line x1="629.00" x2="629.00" y1="162" y2="246" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="629.00" x2="629.00" y1="298" y2="382" stroke="#d8e2e7" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="26" y="152" font-size="16" font-weight="bold" fill="#174f56" text-anchor="start">Mixed prefixes · 1,024 / 2,048 tokens</text>
    <text x="26" y="179" font-size="15" font-weight="normal" fill="#193447" text-anchor="start">Replay after eviction</text>
