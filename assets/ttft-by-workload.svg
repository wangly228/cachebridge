    <circle cx="612.62" cy="372" r="4.3" fill="#096c72"/>
    <line x1="26.00" x2="914.00" y1="391" y2="391" stroke="#c8d5da" stroke-width="1"/>
    <text x="26" y="413" font-size="14" font-weight="normal" fill="#364e5e" text-anchor="start">Whiskers show 95% paired-seed bootstrap intervals (4 seeds, 4,000 draws). Negative values mean lower latency.</text>
    <text x="26" y="435" font-size="14" font-weight="normal" fill="#364e5e" text-anchor="start">cachebridge uses a 32-block first-use budget. Full traces include cold fill, pressure and replay.</text>
  </g>
</svg>
