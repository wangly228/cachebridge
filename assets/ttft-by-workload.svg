    <text x="705" y="377" font-size="15" font-weight="bold" fill="#08676e" text-anchor="end">+5.28%</text>
    <text x="792" y="377" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">1,214.3</text>
    <text x="914" y="377" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">1,278.4</text>
    <line x1="606.87" x2="622.76" y1="372" y2="372" stroke="#109096" stroke-width="2.3"/>
    <line x1="606.87" x2="606.87" y1="368" y2="376" stroke="#109096" stroke-width="1.4"/>
