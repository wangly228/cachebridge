    <text x="792" y="241" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">929.0</text>
    <text x="914" y="241" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">975.6</text>
    <line x1="609.52" x2="617.27" y1="236" y2="236" stroke="#109096" stroke-width="2.3"/>
    <line x1="609.52" x2="609.52" y1="232" y2="240" stroke="#109096" stroke-width="1.4"/>
    <line x1="617.27" x2="617.27" y1="232" y2="240" stroke="#109096" stroke-width="1.4"/>
    <circle cx="611.73" cy="236" r="4.3" fill="#096c72"/>
    <line x1="26.00" x2="914.00" y1="257" y2="257" stroke="#d6e0e5" stroke-width="1"/>
    <text x="26" y="288" font-size="16" font-weight="bold" fill="#174f56" text-anchor="start">Long prefixes · 2,048 tokens</text>
    <text x="26" y="315" font-size="15" font-weight="normal" fill="#193447" text-anchor="start">Replay after eviction</text>
    <text x="234" y="315" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">32</text>
    <text x="705" y="315" font-size="15" font-weight="bold" fill="#08676e" text-anchor="end">−82.39%</text>
    <text x="792" y="315" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">1,212.2</text>
    <text x="914" y="315" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">213.4</text>
    <line x1="306.84" x2="308.81" y1="310" y2="310" stroke="#109096" stroke-width="2.3"/>
    <line x1="306.84" x2="306.84" y1="306" y2="314" stroke="#109096" stroke-width="1.4"/>
    <line x1="308.81" x2="308.81" y1="306" y2="314" stroke="#109096" stroke-width="1.4"/>
    <circle cx="308.40" cy="310" r="4.3" fill="#096c72"/>
    <text x="26" y="346" font-size="15" font-weight="normal" fill="#193447" text-anchor="start">No reuse</text>
    <text x="234" y="346" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">32</text>
