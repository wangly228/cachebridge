    <text x="705" y="179" font-size="15" font-weight="bold" fill="#08676e" text-anchor="end">−81.05%</text>
    <text x="792" y="179" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">932.9</text>
    <text x="914" y="179" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">176.8</text>
    <line x1="311.69" x2="313.77" y1="174" y2="174" stroke="#109096" stroke-width="2.3"/>
    <line x1="311.69" x2="311.69" y1="170" y2="178" stroke="#109096" stroke-width="1.4"/>
    <line x1="313.77" x2="313.77" y1="170" y2="178" stroke="#109096" stroke-width="1.4"/>
    <circle cx="313.07" cy="174" r="4.3" fill="#096c72"/>
    <text x="26" y="210" font-size="15" font-weight="normal" fill="#193447" text-anchor="start">No reuse</text>
    <text x="234" y="210" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">64</text>
    <text x="705" y="210" font-size="15" font-weight="bold" fill="#08676e" text-anchor="end">+2.26%</text>
    <text x="792" y="210" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">930.1</text>
    <text x="914" y="210" font-size="15" font-weight="normal" fill="#193447" text-anchor="end">951.0</text>
    <line x1="598.03" x2="614.12" y1="205" y2="205" stroke="#109096" stroke-width="2.3"/>
    <line x1="598.03" x2="598.03" y1="201" y2="209" stroke="#109096" stroke-width="1.4"/>
